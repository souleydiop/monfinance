name = "monfinance-advisor"
main = "index.js"
compatibility_date = "2026-01-01"

[vars]
# Seule l'origine de ton app peut appeler le proxy (plusieurs possibles, séparées par des virgules)
ALLOWED_ORIGIN = "https://souleydiop.github.io"
# Modèle utilisé (modifiable sans toucher au code)
MODEL = "claude-sonnet-5-5"
# Nombre max de demandes par jour (actif seulement si le KV RATE ci-dessous est lié)
DAILY_LIMIT = "30"
# Effort de réflexion de Claude : low (rapide, économique), medium, high…
EFFORT = "low"
# Plafond de la réponse (la réflexion de Sonnet 5.5 compte dedans : ne pas descendre sous 2048)
MAX_TOKENS = "4096"

# Compteur quotidien — recommandé :
#   npx wrangler kv namespace create RATE
# puis décommente et colle l'id affiché :
# [[kv_namespaces]]
# binding = "RATE"
# id = "COLLE_ICI_L_ID"
